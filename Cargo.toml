[workspace]
members = ["src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: entries in a mod manifest are applied in the order they are written
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # the in-game DLL is built with the MSVC tools
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile

      - name: Frontend
        run: |
          bunx prettier --check .
          bunx vue-tsc --noEmit

      - name: Backend
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p cwoml-core -p cwoml-loader

      - name: Trampolines match their source
        run: cargo test -p cwoml-core --lib -- --ignored trampolines

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # the in-game DLL is built with the MSVC tools
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile

      - name: Frontend
        run: |
          bunx prettier --check .
          bunx vue-tsc --noEmit

      - name: Backend
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p cwoml-core -p cwoml-loader

      - name: Trampolines match their source
        run: cargo test -p cwoml-core --lib -- --ignored trampolines

  linux:
    # the app on Linux. The in-game DLL is a Windows one and is checked above
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Backend
        run: |
          cargo clippy --workspace --exclude cwoml-loader --all-targets -- -D warnings
          cargo test -p cwoml-core

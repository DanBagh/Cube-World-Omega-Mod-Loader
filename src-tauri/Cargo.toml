[package]
name = "cwo-mod-launcher"
version = "0.1.0"
description = "Launcher and mod manager for Cube World Omega"
license = "GPL-3.0-only"
edition = "2024"

[lib]
# distinct from the bin name, same-named lib and bin collide on Windows
name = "cwo_mod_launcher_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cwoml-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
serde.workspace = true
tauri-plugin-dialog = "2.8.2"
base64 = "0.23.1"
